/* Editorial portfolio: monumental type, numbered index with hairline rules, pill UI. Palette and font kept. */
:root{

}

.lang-btn{display:inline-flex;align-items:center;gap:.4rem;background:none;border:1px solid var(--line2);border-radius:var(--pill);padding:0 .9rem;min-height:2.3rem;font-size:.82rem;font-weight:500;transition:border-color var(--fast)}

.worked-list li:last-child{border-bottom:1px solid var(--line2)}
.worked-list .yr{font-size:.82rem;color:var(--muted);text-transform:uppercase;letter-spacing:.12em;font-variant-numeric:tabular-nums}
.worked-list b{font-weight:600;font-size:1.05rem;display:block}
.worked-list span{color:var(--muted);font-size:var(--small)}

/* what I do + tools */
.dos{display:grid;grid-template-columns:repeat(2,1fr);gap:var(--s8) var(--s6);margin-top:0;padding:0;list-style:none}
@media (min-width:56rem){.dos{grid-template-columns:repeat(4,1fr)}}
.dos li{font-size:1.1rem;font-weight:600;border-top:1px solid var(--line2);padding-top:var(--s4)}
.tools-h{display:grid;grid-template-columns:1fr;gap:var(--s10);margin-top:clamp(5rem,10vw,9rem)}
@media (min-width:60rem){.tools-h{grid-template-columns:1fr 1.5fr;gap:var(--s16)}}
.tools-h h2{font-size:var(--display);line-height:.95}
.tools-h .p{color:var(--muted);max-width:52ch;margin-top:var(--s4)}
.tools-grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(5.6rem,7.25rem));justify-content:start;gap:0;margin-top:var(--s8);padding:0 1px 1px 0;list-style:none}
.tool{aspect-ratio:1;background:var(--bg);border:1px solid var(--line2);margin:0 -1px -1px 0;position:relative;display:flex;flex-direction:column;justify-content:space-between;padding:var(--s4);color:var(--muted);transition:background-color var(--normal) var(--ease),color var(--normal) var(--ease);font-size:.78rem;text-transform:uppercase;letter-spacing:.1em}
.tool b{font-size:1.9rem;font-weight:600;line-height:1;letter-spacing:-.04em;color:var(--fg);transition:color var(--normal) var(--ease)}
.tool:hover,.tool:focus-within{z-index:1;background:var(--tc);border-color:var(--tc);color:var(--tt,#fff)}
.tool:hover b,.tool:focus-within b{color:var(--tt,#fff)}

/* game */
.game-wrap{margin-top:var(--s10);display:grid;grid-template-columns:1fr;gap:var(--s10);align-items:start}
@media (min-width:62rem){.game-wrap{grid-template-columns:minmax(0,32rem) minmax(0,1fr);gap:var(--s16)}}
.board{display:grid;grid-template-columns:1.4rem repeat(8,1fr);gap:3px;user-select:none}
.board .lab{font-size:.72rem;color:var(--muted);display:grid;place-items:center;text-transform:uppercase;letter-spacing:.1em}
.c{aspect-ratio:1;background:var(--surface);border:1px solid var(--line);padding:0;position:relative;min-width:0;transition:background-color var(--fast),border-color var(--fast)}
.c:hover:not([data-s]):not(:disabled){border-color:var(--fg)}
.c:disabled{cursor:default}
.c[data-s="miss"]::after{content:"";position:absolute;inset:38%;border:1.5px solid var(--muted);border-radius:var(--pill);animation:pop var(--normal) var(--ease)}
.c[data-s="show"]{border-color:transparent}
.c[data-s="hit"]{background:var(--col);border-color:var(--col)}
.c[data-s="hit"]::after{content:"";position:absolute;inset:36%;background:var(--fg);border-radius:var(--pill);animation:pop var(--normal) var(--ease);z-index:3}
.c[data-s="show"]{background:transparent;border:1.5px dashed var(--col)}
@keyframes pop{from{transform:scale(.3);opacity:0}to{transform:scale(1);opacity:1}}
.c[data-l]::before{content:"";position:absolute;z-index:2;background:var(--fg)}
.c[data-l="h"]::before{left:50%;top:calc(50% - 1px);height:2px;width:calc(100% + 3px);transform-origin:left;animation:lx 500ms var(--ease)}
.c[data-l="v"]::before{top:50%;left:calc(50% - 1px);width:2px;height:calc(100% + 3px);transform-origin:top;animation:ly 500ms var(--ease)}
@keyframes lx{from{transform:scaleX(0)}to{transform:scaleX(1)}}
@keyframes ly{from{transform:scaleY(0)}to{transform:scaleY(1)}}
.panel{display:flex;flex-direction:column;gap:var(--s5);min-width:0}
.meter{display:flex;align-items:baseline;justify-content:space-between;gap:var(--s4);flex-wrap:wrap;border-top:1px solid var(--line2);padding-top:var(--s4)}
.meter .n{font-size:clamp(3rem,6vw,5rem);font-weight:600;line-height:.9;font-variant-numeric:tabular-nums;letter-spacing:-.04em}
.meter .l{color:var(--muted);font-size:var(--small);text-transform:uppercase;letter-spacing:.1em}
.status{min-height:3em;font-weight:600;font-size:var(--h3);line-height:1.2}
.end[hidden]{display:none}
.end{border-top:1px solid var(--line2);padding-top:var(--s5);display:flex;flex-direction:column;gap:var(--s4)}
.end h3{font-size:var(--h3);line-height:1.1}
.end p{color:var(--muted);font-size:var(--small);max-width:46ch}
.end .row2{display:flex;flex-wrap:wrap;gap:.5rem}

/* win dialog */
.win-dlg{border:0;background:var(--bg);color:var(--fg);padding:0;width:min(32rem,calc(100vw - 2rem));max-height:calc(100vh - 2rem);overflow-y:auto;border-radius:1.75rem;box-shadow:0 30px 80px rgba(0,0,0,.4);margin:auto}
.win-dlg::backdrop{background:rgba(20,20,20,.75);backdrop-filter:blur(8px)}
.win-inner{padding:var(--s10) var(--s8);display:flex;flex-direction:column;gap:var(--s5);align-items:flex-start;position:relative}
.win-confetti{position:absolute;inset:0 0 auto 0;height:7rem;overflow:hidden;pointer-events:none;border-radius:1.75rem 1.75rem 0 0}
.win-confetti i{position:absolute;width:.55rem;height:.55rem;top:-.75rem;animation:fall 1.8s var(--ease) forwards}
@keyframes fall{0%{transform:translate3d(0,-1rem,0) rotate(0);opacity:1}100%{transform:translate3d(var(--xd,0),10rem,0) rotate(540deg);opacity:0}}
.win-kicker{font-size:.75rem;color:var(--muted);text-transform:uppercase;letter-spacing:.18em;position:relative;z-index:1}
.win-h{font-size:clamp(2rem,4vw + .5rem,3.4rem);line-height:.95;letter-spacing:-.03em;font-weight:600;position:relative;z-index:1}
.win-p{color:var(--muted);line-height:1.55;max-width:38ch;position:relative;z-index:1}
.win-actions{display:flex;flex-wrap:wrap;gap:.5rem;margin-top:var(--s3);position:relative;z-index:1}
.fleet li{border-top:1px solid var(--line);padding-block:var(--s4);display:grid;grid-template-columns:4.5rem 1fr;gap:.6rem var(--s4);align-items:start}
.segs{display:flex;gap:3px;padding-top:.3rem;width:4.5rem}
.segs i{width:1rem;flex:none;height:.75rem;border:1px solid var(--line2);display:block;transition:background-color var(--normal) var(--ease)}
.segs i.on{background:var(--col);border-color:transparent}
.fleet h3{font-size:1rem;line-height:1.3;font-weight:500}
.fleet .locked h3{color:var(--muted);font-weight:400}
.fleet p{grid-column:2;font-size:.9rem;color:var(--muted);max-width:44ch}

/* contact */
.contact-mono{font-size:var(--mega);line-height:.82;letter-spacing:-.045em;font-weight:600;margin-top:var(--s8)}
.contact-mono span{display:block}
.contact-lead{max-width:46ch;margin-top:var(--s8);font-size:clamp(1.1rem,.9vw + .75rem,1.5rem);color:var(--muted);line-height:1.4}
.mail{margin-top:var(--s16);display:flex;flex-direction:column;gap:.75rem}
.mail .ml{font-size:clamp(1.5rem,4.5vw,3.25rem);font-weight:600;letter-spacing:-.025em;line-height:1.1;overflow-wrap:anywhere;text-decoration:none;background:linear-gradient(currentColor,currentColor) 0 100%/100% .04em no-repeat;transition:opacity var(--fast)}
.mail .ml:hover{opacity:.7}
.mail .copyline{display:flex;align-items:center;gap:.6rem;font-size:.82rem;color:var(--muted);text-transform:uppercase;letter-spacing:.12em}
.mail .copyline button{background:none;border:0;color:inherit;padding:.3rem 0;text-decoration:underline;text-underline-offset:3px;min-height:2rem}
.mail .copyline button:hover,.mail .copyline button:focus-visible{color:var(--fg)}
.c-actions{display:flex;flex-wrap:wrap;gap:.6rem;margin-top:var(--s10)}
.cnext{margin-top:clamp(4rem,8vw,6rem)}
.cnext h2{font-size:var(--small);text-transform:uppercase;letter-spacing:.14em;color:var(--muted);font-weight:500;margin-bottom:var(--s4)}
.cnext ol{counter-reset:s;display:grid;grid-template-columns:1fr;gap:0;list-style:none;margin:0;padding:0}
@media (min-width:60rem){.cnext ol{grid-template-columns:repeat(3,1fr)}}
.cnext li{counter-increment:s;border-top:1px solid var(--line2);padding:var(--s5) 0;display:flex;flex-direction:column;gap:var(--s2)}
.cnext li::before{content:"0" counter(s);font-size:.78rem;text-transform:uppercase;letter-spacing:.14em;color:var(--muted)}
.cnext h3{font-size:1.2rem;font-weight:600}
.cnext p{color:var(--muted);font-size:var(--small);max-width:30ch}

/* projects page toolbar */
.pj-tools{display:flex;align-items:center;justify-content:space-between;gap:var(--s4);margin-bottom:var(--s10);border-top:1px solid var(--line2);padding-top:var(--s5);flex-wrap:wrap}
.pj-tools .count{font-size:.78rem;color:var(--muted);text-transform:uppercase;letter-spacing:.14em;font-variant-numeric:tabular-nums}
.view-seg{display:inline-flex;border:1px solid var(--line2);border-radius:var(--pill);padding:3px}
.view-seg button{padding:.4rem .9rem;border:0;background:none;border-radius:var(--pill);min-height:2rem;font-size:.78rem;text-transform:uppercase;letter-spacing:.12em;transition:background-color var(--fast),color var(--fast)}
.view-seg button[aria-pressed="true"]{background:var(--fg);color:var(--bg)}
.pj-grid.list{grid-template-columns:1fr;gap:0}
.pj-grid.list .pj-card{display:grid;grid-template-columns:minmax(0,13rem) minmax(0,1fr);gap:var(--s6) var(--s8);align-items:center;padding-block:var(--s6);border-top:1px solid var(--line2)}
.pj-grid.list .pj-card:last-child{border-bottom:1px solid var(--line2)}
.pj-grid.list .pj-card .art{border-radius:.6rem}
.pj-grid.list .pj-card h2{font-size:clamp(1.5rem,2.6vw,2.6rem)}
@media (max-width:40rem){.pj-grid.list .pj-card{grid-template-columns:5.5rem minmax(0,1fr);gap:var(--s4)}.pj-grid.list .pj-card .go{width:2.2rem;height:2.2rem}.pj-grid.list .pj-card h2{font-size:1.35rem}}

/* rotating orb */
.orb{position:relative;display:inline-grid;place-items:center;width:clamp(8.5rem,11vw,10rem);aspect-ratio:1;place-content:center;border-radius:var(--pill);background:var(--fg);color:var(--bg);text-decoration:none;flex-shrink:0;transform:scale(.75);transition:transform 400ms var(--ease)}
.orb:focus-visible{outline:2px solid var(--fg);outline-offset:4px}
@media (hover:hover) and (pointer:fine){.orb:hover{transform:scale(.82)}}
.orb svg.rot text tspan{transition:fill 400ms var(--ease)}
.orb:hover .t1,.orb:focus-visible .t1{fill:var(--mint)}.orb:hover .t2,.orb:focus-visible .t2{fill:var(--mustard)}.orb:hover .t3,.orb:focus-visible .t3{fill:var(--coral)}.orb:hover .t4,.orb:focus-visible .t4{fill:var(--lav)}.orb:hover .t5,.orb:focus-visible .t5{fill:var(--mint)}
.orb svg.rot{position:absolute;inset:0;width:100%;height:100%;animation:spin 18s linear infinite;color:inherit;pointer-events:none}
.orb svg.rot text{font-size:6.4px;letter-spacing:.14em;text-transform:uppercase;font-weight:500;fill:currentColor}
.orb .orb-arr{font-size:clamp(1.5rem,2.5vw,2.3rem);font-weight:300;line-height:1;position:relative;z-index:1;transform:rotate(-45deg);transition:transform var(--fast)}
@media (hover:hover) and (pointer:fine){.orb:hover .orb-arr{transform:rotate(0)}}
@keyframes spin{to{transform:rotate(360deg)}}

/* MONUMENTAL FOOTER */
.bigfoot{border-top:1px solid var(--line2);padding-block:clamp(5rem,10vw,9rem) 0;margin-top:clamp(5rem,10vw,8rem);position:relative;overflow:hidden}
.bigfoot .meta{display:flex;justify-content:space-between;gap:var(--s4);font-size:var(--micro);color:var(--muted);text-transform:uppercase;letter-spacing:.14em;margin-bottom:var(--s10);flex-wrap:wrap}
.bigfoot .meta b{color:var(--fg);font-weight:500}
.bigfoot-lead{display:grid;grid-template-columns:1fr;gap:var(--s6);align-items:end;margin-bottom:var(--s10)}
@media (min-width:52rem){.bigfoot-lead{grid-template-columns:1fr auto;gap:var(--s12)}}
.bigfoot-h{font-size:clamp(4rem,16vw,16rem);line-height:.85;letter-spacing:-.05em;font-weight:600;color:var(--fg)}
.bigfoot-sub{font-size:var(--small);color:var(--muted);text-transform:uppercase;letter-spacing:.16em;margin-bottom:var(--s3);display:block}
.bigfoot-mail{display:inline-block;font-size:clamp(1.2rem,2.5vw,2.25rem);font-weight:500;letter-spacing:-.02em;text-decoration:none;background:linear-gradient(currentColor,currentColor) 0 100%/100% .04em no-repeat;margin-top:var(--s6);overflow-wrap:anywhere;transition:opacity var(--fast)}
.bigfoot-mail:hover{opacity:.65}

/* marquee */
.marquee{overflow:hidden;margin-top:var(--s8);border-block:1px solid var(--line2);padding-block:var(--s5)}
.marquee-track{display:inline-flex;white-space:nowrap;animation:marq 28s linear infinite;font-size:clamp(2rem,4.5vw,4.5rem);font-weight:500;letter-spacing:-.02em;color:var(--muted);gap:2rem}
.marquee-track i{display:inline-block;width:.6rem;height:.6rem;border-radius:var(--pill);background:var(--coral);align-self:center;flex-shrink:0}
.marquee-track i:nth-of-type(2n){background:var(--lav)}
.marquee-track i:nth-of-type(3n){background:var(--mustard)}
.marquee-track i:nth-of-type(4n){background:var(--mint)}
.marquee:hover .marquee-track{animation-play-state:paused}
@keyframes marq{to{transform:translateX(-50%)}}

/* compact footer */
footer{padding-block:var(--s6);font-size:var(--micro);color:var(--muted);text-transform:uppercase;letter-spacing:.14em}
footer .wrap{display:flex;flex-wrap:wrap;gap:var(--s3) var(--s8);justify-content:space-between;align-items:center}
footer a{color:var(--fg);text-decoration:none}
footer a:hover{text-decoration:underline;text-underline-offset:3px}

/* CTA band with orb + hover texture */
.cta-band{min-height:15rem;display:grid;grid-template-columns:1fr;gap:var(--s6);align-items:center;position:relative;padding:var(--s10) var(--s8);background:var(--surface);border-radius:2rem;overflow:hidden;transition:background-color var(--normal) var(--ease)}
.cta-band::before{content:"";position:absolute;inset:0;background-image:radial-gradient(circle,var(--fg) 1px,transparent 1.2px);background-size:18px 18px;opacity:0;transition:opacity 700ms var(--ease);pointer-events:none;mix-blend-mode:normal}
.cta-band:hover::before,.cta-band:focus-within::before{opacity:.08}
.cta-band::after{content:"";position:absolute;inset:0;background:radial-gradient(circle at 70% 50%,var(--mint) 0,transparent 55%);opacity:0;transition:opacity 700ms var(--ease);pointer-events:none;mix-blend-mode:multiply}
.cta-band:hover::after,.cta-band:focus-within::after{opacity:.14}
.cta-band > *{position:relative;z-index:1}
@media (min-width:52rem){.cta-band{grid-template-columns:1fr auto;gap:var(--s10)}}
.cta-band .pack{display:flex;flex-wrap:wrap;gap:.5rem}

/* socials */
.socials{display:flex;flex-wrap:wrap;gap:.4rem;margin-top:var(--s5)}
.socials a{display:inline-flex;align-items:center;gap:.4rem;padding:.4rem .9rem;border:1px solid var(--line2);border-radius:var(--pill);font-size:.82rem;text-decoration:none;transition:border-color var(--fast),background-color var(--fast),color var(--fast)}
.socials a:hover,.socials a:focus-visible{border-color:var(--fg);background:var(--fg);color:var(--bg)}
.socials svg{width:.9rem;height:.9rem}
.socials .arr{font-size:.85rem;opacity:.6}
.socials-foot{display:flex;flex-wrap:wrap;gap:0 var(--s4);font-size:.85rem;text-transform:none;letter-spacing:.01em;list-style:none;padding:0;margin:0}
.socials-foot a{color:var(--muted);text-decoration:none;transition:color var(--fast)}
.socials-foot a:hover{color:var(--fg)}


/* chat hide when footer visible */
.chatbtn.hide{opacity:0;transform:translateY(20px);pointer-events:none}
.chatbtn{transition:transform var(--normal) var(--ease),opacity var(--normal) var(--ease),box-shadow var(--fast)}

/* dialog form */
dialog{background:var(--bg);color:var(--fg);border:1px solid var(--fg);padding:var(--s8);width:min(36rem,calc(100vw - 2rem));max-height:calc(100vh - 2rem);overflow-y:auto;border-radius:1.5rem}
dialog::backdrop{background:rgba(20,20,20,.65);backdrop-filter:blur(4px)}
dialog h2{font-size:var(--h2);line-height:1;margin-bottom:var(--s3)}
dialog .sub{color:var(--muted);font-size:var(--small);margin-bottom:var(--s6)}
.f{display:flex;flex-direction:column;gap:.3rem;margin-bottom:var(--s4)}
.f label{font-size:.78rem;color:var(--muted);text-transform:uppercase;letter-spacing:.14em}
.f input,.f select,.f textarea{font:inherit;color:inherit;background:var(--surface);border:1px solid var(--line);padding:.85rem 1rem;border-radius:1rem;width:100%}
.f textarea{min-height:7rem;resize:vertical}
.f input:focus,.f select:focus,.f textarea:focus{outline:none;border-color:var(--fg)}
.dx{position:absolute;top:1.1rem;right:1.1rem;background:none;border:1px solid var(--line2);border-radius:var(--pill);width:2.5rem;height:2.5rem;font-size:1.1rem;transition:background-color var(--fast)}
.dx:hover{background:var(--surface)}
.err{color:var(--coral);font-size:var(--small);min-height:1.5em;margin-bottom:var(--s3)}
.d-res[hidden]{display:none}

/* chat */
.chatbtn{position:fixed;right:max(20px,env(safe-area-inset-right,0px));bottom:calc(20px + env(safe-area-inset-bottom,0px));z-index:35;display:inline-flex;align-items:center;gap:.6rem;min-height:3rem;padding:0 1.3rem;background:var(--fg);color:var(--bg);border:0;border-radius:var(--pill);font-weight:500;font-size:.88rem;box-shadow:0 10px 30px rgba(0,0,0,.18);transition:transform var(--fast),box-shadow var(--fast)}
.chatbtn:hover,.chatbtn:focus-visible{transform:translateY(-2px);box-shadow:0 14px 40px rgba(0,0,0,.25)}
.chatbtn .spark{display:inline-flex;width:1.2rem;height:1.2rem;align-items:center;justify-content:center}
.chatbtn .spark::before{content:"";width:.5rem;height:.5rem;border-radius:var(--pill);background:var(--mint);box-shadow:0 0 0 .2rem rgba(114,206,167,.25)}
.chatbtn[aria-expanded="true"]{background:var(--surface);color:var(--fg)}
.chat{position:fixed;right:max(20px,env(safe-area-inset-right,0px));bottom:calc(5.5rem + env(safe-area-inset-bottom,0px));z-index:36;width:min(28rem,calc(100vw - 40px));height:min(43rem,calc(100svh - 7.5rem));background:var(--bg);border:1px solid var(--fg);display:flex;flex-direction:column;border-radius:1.5rem;overflow:hidden;box-shadow:0 20px 60px rgba(0,0,0,.25);opacity:0;transform:translateY(12px);pointer-events:none;transition:opacity var(--normal) var(--ease),transform var(--normal) var(--ease)}
.chat.open{opacity:1;transform:translateY(0);pointer-events:auto}
.chat-h{display:flex;justify-content:space-between;align-items:center;padding:var(--s4) var(--s5);border-bottom:1px solid var(--line)}
.chat-h .ha{display:flex;align-items:center;gap:.6rem}
.chat-h .ha .av{width:2rem;height:2rem;border-radius:var(--pill);background:var(--fg);color:var(--bg);display:grid;place-items:center;font-size:.78rem;font-weight:600;letter-spacing:0}
.chat-h h2{font-size:.95rem;font-weight:600}
.chat-h p{font-size:.72rem;color:var(--muted);text-transform:uppercase;letter-spacing:.12em;margin-top:.1rem}
.chat-h .dx2{background:none;border:0;width:2.5rem;height:2.5rem;font-size:1.4rem;color:var(--muted);border-radius:var(--pill);transition:background-color var(--fast),color var(--fast)}
.chat-h .dx2:hover{background:var(--surface);color:var(--fg)}
.chat-log{flex:1;overflow-y:auto;padding:var(--s4) var(--s5);display:flex;flex-direction:column;gap:var(--s4)}

/* Yodis Brownie Jr. */
.chat-h .ha{min-width:0}.chat-h .ha .av{font-size:.74rem;letter-spacing:-.02em;flex:none}.chat-h .ha>div{min-width:0}.chat-h p{text-transform:none;letter-spacing:0;font-size:.8rem;line-height:1.3;margin-top:.15rem;color:color-mix(in srgb,var(--fg) 80%,var(--bg))}
.y-tools{display:flex;align-items:center;gap:.1rem}
.y-ic{width:2.5rem;height:2.5rem;border:0;background:none;border-radius:var(--pill);color:var(--muted);display:grid;place-items:center;transition:background-color var(--fast),color var(--fast)}
.y-ic:hover:not(:disabled){background:var(--surface);color:var(--fg)}
.y-ic:disabled{opacity:.3;cursor:default}
.chat-log{gap:var(--s5);padding:var(--s5) var(--s5) var(--s6);scrollbar-width:thin}
.y-turn{outline:0;display:flex;flex-direction:column;gap:var(--s4);animation:yin 220ms var(--ease) both}
.y-turn{gap:var(--s3)}.y-msg{font-size:1.06rem;line-height:1.58;letter-spacing:-.003em;color:var(--fg);max-width:36em}.y-q{margin-top:var(--s3)}
.y-q{font-size:1rem;font-weight:600;line-height:1.35;color:var(--fg)}
.y-opts{display:flex;flex-direction:column;gap:.45rem}
